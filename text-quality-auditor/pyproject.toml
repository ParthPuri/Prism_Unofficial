[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-quality-auditor"
version = "0.3.0"
description = "AI policy planning with deterministic local text dataset auditing"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
arrow = ["pyarrow>=14.0.0"]

[project.scripts]
text-audit = "textaudit.cli:main"

[tool.setuptools.packages.find]
include = ["textaudit*"]
