[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-quality-auditor"
version = "0.3.0"
description = "AI policy planning with deterministic local text dataset auditing"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gx = ["great_expectations==1.24.0", "pandas>=2.1,<3"]

[project.scripts]
text-audit = "textaudit.cli:main"

[tool.setuptools.packages.find]
include = ["textaudit*"]
